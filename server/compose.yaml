# Local development database. Started automatically by `./gradlew bootRun`
# (spring-boot-docker-compose). Production uses MongoDB Atlas.
services:
  mongodb:
    image: 'mongo:8.0'
    environment:
      - 'MONGO_INITDB_DATABASE=buddychat'
      - 'MONGO_INITDB_ROOT_USERNAME=root'
      - 'MONGO_INITDB_ROOT_PASSWORD=local-only'
    ports:
      - '27017'
